<!DOCTYPE html>
<html>
<head>
    <title>Register - EdgeLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white flex items-center justify-center h-screen">

<div class="bg-gray-800 p-8 rounded-xl w-96">

    <h1 class="text-2xl font-bold mb-5">Register</h1>

    <form method="POST" class="grid gap-3">

        <input name="username" placeholder="Username"
            class="p-3 rounded bg-gray-900">

        <input name="password" type="password" placeholder="Password"
            class="p-3 rounded bg-gray-900">

        <button class="bg-green-500 p-3 rounded font-bold">
            Create Account
        </button>

    </form>

    <p class="mt-4 text-sm">
        Already have account?
        <a href="/login" class="text-blue-400">Login</a>
    </p>

</div>

</body>
</html>
