<!DOCTYPE html>
<html>
<head>
<title>Register - EdgeLog</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center h-screen">

<div class="w-96 p-6 rounded-2xl border border-gray-800 bg-gray-900">

<h1 class="text-xl font-bold mb-2">Create account</h1>

<p class="text-xs text-gray-400 mb-4">
Password must be 8+ chars, include A-Z, a-z, 0-9
</p>

<form method="POST" class="grid gap-3">

<input name="username" placeholder="Username"
class="p-3 rounded-xl bg-black border border-gray-700">

<input name="password" type="password" placeholder="Password"
class="p-3 rounded-xl bg-black border border-gray-700">

<button class="bg-white text-black p-3 rounded-xl font-bold">
Register
</button>

</form>

<p class="text-sm mt-3 text-gray-400">
Already have account?
<a href="/login" class="text-blue-400">Login</a>
<a href="/privacy" class="text-gray-500 text-xs">Privacy Policy</a>
</p>

</div>

</body>
</html>
