<!DOCTYPE html>
<html>
<head>
    <title>EdgeLog</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
            "Segoe UI", Roboto, sans-serif;
            background: #0b0f17;
        }

        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card {
            transition: 0.2s;
        }

        .card:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<div class="glass p-5 rounded-3xl mb-6">

    <h2 class="text-lg font-semibold">💡 Daily Motivation</h2>

    <p id="quote" class="text-gray-300 text-sm mt-2"></p>

</div>

<script>
const quotes = [
    "Discipline beats intelligence in trading.",
    "Protect capital first, profits come later.",
    "Losses are lessons, not failures.",
    "Trade less, think more.",
    "Consistency builds wealth."
];

document.getElementById("quote").innerText =
    quotes[Math.floor(Math.random() * quotes.length)];
</script>
<body class="text-white">

<!-- TOP BAR -->
<div class="p-5 flex justify-between items-center border-b border-gray-800">
    <h1 class="text-xl font-semibold">EdgeLog</h1>
    <span class="text-xs text-gray-400">AI Trading Journal</span>
</div>

<div class="max-w-6xl mx-auto p-5">

<!-- AI INSIGHT PANEL -->
<div class="glass p-5 rounded-3xl mb-6">
    <h2 class="text-lg font-semibold">🤖 AI Coach</h2>

    <p id="aiText" class="text-gray-300 text-sm mt-2">
        Loading AI analysis...
    </p>
</div>

<script>
fetch("/ai-insight")
.then(res => res.json())
.then(data => {
    document.getElementById("aiText").innerText = data.ai;
});
</script>
<!-- STATS -->
<div class="grid grid-cols-3 gap-3 mb-6">

    <div class="glass p-4 rounded-2xl text-center card">
        <p class="text-gray-400 text-xs">Trades</p>
        <h2 class="text-xl font-bold">{{total}}</h2>
    </div>

    <div class="glass p-4 rounded-2xl text-center card">
        <p class="text-gray-400 text-xs">Win Rate</p>
        <h2 class="text-xl font-bold text-green-400">{{win_rate}}%</h2>
    </div>

    <div class="glass p-4 rounded-2xl text-center card">
        <p class="text-gray-400 text-xs">Status</p>
        <h2 class="text-xl font-bold text-blue-400">Active</h2>
    </div>

</div>

<!-- CHART -->
<div class="glass p-5 rounded-3xl mb-6 card">
    <h2 class="mb-3 font-semibold">Equity Curve</h2>
    <canvas id="chart"></canvas>
</div>

<!-- ADD TRADE -->
<form method="POST" action="/add" class="grid gap-3">

    <!-- PAIR -->
    <select name="symbol"
        class="p-3 rounded-xl bg-black border border-gray-700">
        <option>EURUSD</option>
        <option>GBPUSD</option>
        <option>USDJPY</option>
        <option>XAUUSD (Gold)</option>
        <option>BTCUSD</option>
    </select>

    <!-- RESULT -->
    <select name="result"
        class="p-3 rounded-xl bg-black border border-gray-700">
        <option value="win">Win</option>
        <option value="loss">Loss</option>
    </select>

    <!-- PIPS -->
    <input name="profit" placeholder="Pips (e.g. +25 / -15)"
        class="p-3 rounded-xl bg-black border border-gray-700">

    <!-- NOTES -->
    <input name="notes" placeholder="Trade Reason / Setup"
        class="p-3 rounded-xl bg-black border border-gray-700">

    <button class="bg-white text-black p-3 rounded-xl font-semibold">
        Save Trade
    </button>

</form>
    </form>

</div>

<!-- HISTORY -->
<div class="glass p-5 rounded-3xl card">

    <h2 class="mb-3 font-semibold">📊 Trade History</h2>

    <div class="space-y-2">

        {% for t in trades %}
        <div class="p-3 rounded-xl bg-black border border-gray-800 flex justify-between">

            <div>
                <p class="font-semibold">{{t.symbol}}</p>
                <p class="text-xs text-gray-500">{{t.notes}}</p>
            </div>

            <div class="text-right">
                <p class="{% if t.result=='win' %}text-green-400{% else %}text-red-400{% endif %}">
                    {{t.profit}}
                </p>
                <p class="text-xs text-gray-500">{{t.date}}</p>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

</div>

<!-- CHART SCRIPT -->
<script>
const equity = {{ equity|tojson }};

new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
        labels: equity.map((_, i) => i + 1),
        datasets: [{
            data: equity,
            borderColor: "#ffffff",
            tension: 0.35,
            pointRadius: 0
        }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: {
            x: { display: false },
            y: { display: false }
        }
    }
});
</script>

</body>
</html>
